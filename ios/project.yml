name: Solar
options:
  bundleIdPrefix: ca.davidalleyne
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.8.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M8GX2N7YR2
targets:
  Solar:
    type: application
    platform: iOS
    sources:
      - Solar
      - path: SolarWidgets/WidgetData.swift
      - path: SolarWidgets/Shared.swift
      - path: Preview/sample-data.json
        buildPhase: resources
    dependencies:
      - target: SolarWidgets
        embed: true
    scheme:
      testTargets: [SolarUITests]
    info:
      path: Solar/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Solar uses the microphone when you tap the mic in Ask to talk to Sunny.
        NSFaceIDUsageDescription: Solar uses Face ID to unlock your energy data.
        NSSpeechRecognitionUsageDescription: Your spoken question to Sunny is turned into text on this iPhone.
        NSCameraUsageDescription: Solar uses the camera if you choose to photograph a Toronto Hydro bill to upload.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ca.davidalleyne.solar.refresh]
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.davidalleyne.solar
        PRODUCT_NAME: Solar
        CODE_SIGN_ENTITLEMENTS: Solar/Solar.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Solar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  SolarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SolarWidgets
    info:
      path: SolarWidgets/Info.plist
      properties:
        CFBundleDisplayName: Solar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.davidalleyne.solar.widgets
        PRODUCT_NAME: SolarWidgets
        CODE_SIGN_ENTITLEMENTS: SolarWidgets/SolarWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  SolarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SolarUITests]
    dependencies:
      - target: Solar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.davidalleyne.solar.uitests
        TEST_TARGET_NAME: Solar
        GENERATE_INFOPLIST_FILE: YES
  SolarTV:
    type: application
    platform: tvOS
    sources:
      - TV
      - Solar/Model
      - path: Solar/GitHub.swift
      - path: SolarWidgets/WidgetData.swift
      - path: Preview/sample-data.json
        buildPhase: resources
    dependencies:
      - target: SolarTopShelf
        embed: true
    info:
      path: TV/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleURLTypes:
          - CFBundleURLName: ca.davidalleyne.solar
            CFBundleURLSchemes: [solar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.davidalleyne.solar
        PRODUCT_NAME: Solar
        CODE_SIGN_ENTITLEMENTS: TV/SolarTV.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Solar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
  SolarTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - TopShelf
      - path: SolarWidgets/WidgetData.swift
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Solar
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.davidalleyne.solar.topshelf
        PRODUCT_NAME: SolarTopShelf
        CODE_SIGN_ENTITLEMENTS: TopShelf/SolarTopShelf.entitlements
        TARGETED_DEVICE_FAMILY: "3"
        SKIP_INSTALL: YES
