name: Solar
options:
  bundleIdPrefix: ca.davidalleyne
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M8GX2N7YR2
targets:
  Solar:
    type: application
    platform: iOS
    sources: [Solar]
    info:
      path: Solar/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Solar uses the microphone when you tap the mic in Ask to talk to Sunny.
        NSCameraUsageDescription: Solar uses the camera if you choose to photograph a Toronto Hydro bill to upload.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.davidalleyne.solar
        PRODUCT_NAME: Solar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Solar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
