name: Revoke SolarEdge token

# one-off: cancel the stored SolarEdge connection so a fresh approval can be made
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revoke:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = "https://monitoringapi.solaredge.com/v2/oauth2/revoke-token"
          tok = os.environ["TOKEN"].strip()
          bodies = [{"token": tok},
                    {"token": tok, "client_id": os.environ["CID"].strip(), "client_secret": os.environ["SECRET"].strip()}]
          for b in bodies:
              req = urllib.request.Request(url, method="POST", data=json.dumps(b).encode(),
                                           headers={"Content-Type": "application/json", "Accept": "application/json", "User-Agent": "home-solar"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("revoke:", r.status, r.read()[:300].decode(errors="replace")); break
              except urllib.error.HTTPError as e:
                  print("revoke:", e.code, e.read()[:300].decode(errors="replace"))
          PY
        env:
          TOKEN: ${{ secrets.SOLAREDGE_REFRESH_TOKEN }}
          CID: ${{ secrets.SOLAREDGE_CLIENT_ID }}
          SECRET: ${{ secrets.SOLAREDGE_CLIENT_SECRET }}
