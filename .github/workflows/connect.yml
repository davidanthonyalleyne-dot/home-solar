name: Connect SolarEdge

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code from the callback page (or the whole address)"
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/connect.py
        env:
          CODE: ${{ inputs.code }}
          SOLAREDGE_CLIENT_ID: ${{ secrets.SOLAREDGE_CLIENT_ID }}
          SOLAREDGE_CLIENT_SECRET: ${{ secrets.SOLAREDGE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - name: Rebuild the site
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
