name: TestFlight check

# Prints what App Store Connect knows about Solar's TestFlight testing: the latest builds on
# each platform, the groups, and who is testing (first names only). Run by hand.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - run: pip install --quiet pyjwt cryptography
      - shell: python
        run: |
          import json, os, time, urllib.request, urllib.error, jwt
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
                           os.environ["ASC_KEY_P8"], algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def call(path):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, headers={"Authorization": f"Bearer {tok}"})
              try:
                  return json.loads(urllib.request.urlopen(r).read())
              except urllib.error.HTTPError as e:
                  print(path, e.code, e.read()[:300].decode(errors="ignore")); return {}
          app = call("/v1/apps?filter[bundleId]=ca.davidalleyne.solar")["data"][0]["id"]
          for plat in ("IOS", "TV_OS"):
              bs = call(f"/v1/builds?filter[app]={app}&filter[preReleaseVersion.platform]={plat}&sort=-uploadedDate&limit=3&include=preReleaseVersion,buildBetaDetail")
              inc = {(i["type"], i["id"]): i["attributes"] for i in bs.get("included", [])}
              for b in bs.get("data", []):
                  a = b["attributes"]
                  pv = inc.get(("preReleaseVersions", b["relationships"]["preReleaseVersion"]["data"]["id"]), {})
                  bd = inc.get(("buildBetaDetails", (b["relationships"].get("buildBetaDetail", {}).get("data") or {}).get("id")), {})
                  print(plat, pv.get("version"), "build", a.get("version"), a.get("processingState"), "expired" if a.get("expired") else "", bd.get("internalBuildState"), a.get("uploadedDate"))
          for g in call(f"/v1/apps/{app}/betaGroups?limit=50").get("data", []):
              print("group", g["attributes"].get("name"), g["attributes"].get("isInternalGroup"), g["attributes"].get("hasAccessToAllBuilds"))
              for t in call(f"/v1/betaGroups/{g['id']}/betaTesters?limit=50").get("data", []):
                  print("   in group:", t["attributes"].get("firstName"), t["attributes"].get("inviteType"), t["attributes"].get("state"))
          for t in call(f"/v1/betaTesters?filter[apps]={app}&limit=50").get("data", []):
              print("app tester:", t["attributes"].get("firstName"), t["attributes"].get("inviteType"), t["attributes"].get("state"))
          for u in call("/v1/users?limit=20").get("data", []):
              a = u["attributes"]
              print("team user:", a.get("firstName"), a.get("roles"), "all apps" if a.get("allAppsVisible") else "")
