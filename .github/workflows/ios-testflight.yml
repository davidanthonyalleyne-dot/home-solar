name: iOS app to TestFlight

# Builds the iPhone app (ios/) and uploads it to TestFlight.
# Runs when something under ios/ changes, or by hand from the Actions tab.
# The website itself doesn't need this: the app loads the live site, so site changes appear without a new build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: M8GX2N7YR2
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the App Store Connect key is in place
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "${{ secrets.ASC_KEY_P8 }}" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Use the newest Xcode 26 or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 26+ on this runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Write the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Give the app the site's passphrase (scrambled, never committed)
        run: |
          python3 - <<'PY'
          import os, secrets
          p = os.environ.get("SITE_PASSPHRASE", "").encode()
          if not p:
              print("::warning::SITE_PASSPHRASE is empty; the app will ask for the passphrase")
          k = secrets.token_bytes(max(len(p), 1))
          x = bytes(a ^ b for a, b in zip(p, k))
          arr = lambda b: ", ".join(str(v) for v in b)
          open("Solar/Secrets.swift", "w").write(
              "enum Secrets {\n"
              f"    private static let a: [UInt8] = [{arr(x)}]\n"
              f"    private static let b: [UInt8] = [{arr(k)}]\n"
              "    static var passphrase: String { String(decoding: zip(a, b).map { $0 ^ $1 }, as: UTF8.self) }\n"
              "}\n")
          PY

      - name: Register the widget's bundle ID (no-op once it exists)
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, jwt
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
                           open(os.environ["KEY_PATH"]).read(), algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          body = json.dumps({"data": {"type": "bundleIds", "attributes": {"identifier": "ca.davidalleyne.solar.widgets", "name": "Solar Widgets", "platform": "IOS"}}}).encode()
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/bundleIds", body, {"Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req); print("registered ca.davidalleyne.solar.widgets")
          except urllib.error.HTTPError as e:
              print("already registered" if e.code == 409 else f"{e.code} {e.read()[:300]}")
          PY

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (ad hoc signed so its entitlements carry over; the upload step signs it for distribution)
        run: |
          xcodebuild archive \
            -project Solar.xcodeproj \
            -scheme Solar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Solar.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          echo "Entitlements in the archive:"
          codesign -d --entitlements - "$RUNNER_TEMP/Solar.xcarchive/Products/Applications/Solar.app" 2>&1 | tail -20

      - name: Sign and upload to TestFlight
        run: |
          # first export locally to check Sign in with Apple survived the distribution signing
          cat > "$RUNNER_TEMP/Local.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Solar.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/Local.plist" \
            -exportPath "$RUNNER_TEMP/local" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q -o "$RUNNER_TEMP/local/Solar.ipa" -d "$RUNNER_TEMP/ipa"
          ENT=$(codesign -d --entitlements - "$RUNNER_TEMP/ipa/Payload/Solar.app" 2>&1)
          echo "$ENT" | tail -20
          echo "$ENT" | grep -q applesignin || { echo "::error::Sign in with Apple entitlement missing from the signed app"; exit 1; }

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Solar.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
