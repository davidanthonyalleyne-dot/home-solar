name: iOS screenshots

# Builds the iPhone app for the simulator and photographs the native screens with sample
# numbers (Debug build, launched with -previewNow), light and dark. Run by hand; the pictures
# are attached to the run as "screens".

on:
  workflow_dispatch:

jobs:
  screens:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode 26 or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
      - name: Build for the simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project Solar.xcodeproj -scheme Solar -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -60; exit 1; }
      - name: Photograph Now and Month
        run: |
          # an iPhone on the newest iOS runtime (26 or later), where the tab bar is Liquid Glass
          DEV=$(xcrun simctl list devices available | awk '/^-- iOS 2[6-9]/{f=1;next} /^--/{f=0} f' | grep -E "iPhone 1[6-9] Pro \(" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"; xcrun simctl list devices | grep "$DEV"
          echo "device $DEV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name "Solar.app")
          xcrun simctl install "$DEV" "$APP"
          mkdir -p "$RUNNER_TEMP/screens"
          for mode in light dark; do
            xcrun simctl ui "$DEV" appearance $mode
            for screen in now month history energy ask settings solaredge; do
              xcrun simctl terminate "$DEV" ca.davidalleyne.solar || true
              HV=cost; [ "$screen" = energy ] && HV=energy
              xcrun simctl launch "$DEV" ca.davidalleyne.solar -previewNow -$screen -histView $HV
              sleep 6
              xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/screens/$screen-$mode.png"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/screens

  tv:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode 26 or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the Apple TV simulator (shows compile errors clearly)
        run: |
          xcodebuild build -project Solar.xcodeproj -scheme SolarTV -configuration Debug -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -80; tail -30 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "built"

      - name: Photograph the screens in the simulator
        continue-on-error: true
        run: |
          DEV=$(xcrun simctl list devices available | awk '/^-- tvOS/{f=1;next} /^--/{f=0} f' | grep -E "Apple TV 4K" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$(find "$RUNNER_TEMP/dd/Build/Products/Debug-appletvsimulator" -maxdepth 1 -name Solar.app)"
          mkdir -p "$RUNNER_TEMP/tvshots"
          for tab in now month history ask settings ambient; do
            xcrun simctl terminate "$DEV" ca.davidalleyne.solar || true
            xcrun simctl launch "$DEV" ca.davidalleyne.solar -previewTV -$tab
            sleep 8
            xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/tvshots/$tab.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvshots
          path: ${{ runner.temp }}/tvshots
          retention-days: 3

