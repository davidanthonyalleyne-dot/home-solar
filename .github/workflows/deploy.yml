name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # hourly; the build skips SolarEdge overnight to save API credits
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # to save bills and meter files added from the app
  pages: write
  id-token: write
  issues: write

# never cancel a run part way: it may have just rotated the SolarEdge token
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so the build can count versions
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q poppler-utils  # pdftotext, to read bill PDFs
      - run: pip install openpyxl cryptography pywebpush
      - id: build
        run: python scripts/build.py
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          SOLAREDGE_SITE_ID: ${{ secrets.SOLAREDGE_SITE_ID }}
          SOLAREDGE_CLIENT_ID: ${{ secrets.SOLAREDGE_CLIENT_ID }}
          SOLAREDGE_CLIENT_SECRET: ${{ secrets.SOLAREDGE_CLIENT_SECRET }}
          SOLAREDGE_REFRESH_TOKEN: ${{ secrets.SOLAREDGE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
          SYSTEM_PRIVATE: ${{ secrets.SYSTEM_PRIVATE }}
          HVAC_PRIVATE: ${{ secrets.HVAC_PRIVATE }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - name: Save files added from the app
        if: steps.build.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data/
            git commit -m "Add files uploaded from the app"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
      - name: Report problems as GitHub issues
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: python scripts/notify.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - if: steps.build.outputs.token_lost == 'true'
        run: |
          echo "::error::The SolarEdge refresh token couldn't be saved. Run the Connect SolarEdge workflow again."
          exit 1
