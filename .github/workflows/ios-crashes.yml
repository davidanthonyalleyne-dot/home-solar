name: iOS crash check

# Two ways to find why the app crashed. First, any crash reports sent from TestFlight
# (App Store Connect API). Second, the app is run in the iOS 26 simulator with its tab bar
# switching quickly for about a minute, and any crash report the simulator writes is kept.
# Run by hand; results are attached as "crashes" (kept one day).

on:
  workflow_dispatch:

jobs:
  crashes:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: TestFlight crash reports
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/crashes/testflight" "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/key.p8"
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          KEY="$RUNNER_TEMP/keys/key.p8" OUT="$RUNNER_TEMP/crashes/testflight" python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, jwt
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
                           open(os.environ["KEY"]).read(), algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def get(path):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, headers={"Authorization": f"Bearer {tok}"})
              try:
                  return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e:
                  print(path, e.code, e.read()[:300]); return None
          apps = get("/v1/apps?filter[bundleId]=ca.davidalleyne.solar") or {}
          for app in apps.get("data", []):
              subs = get(f"/v1/apps/{app['id']}/betaFeedbackCrashSubmissions?limit=10&sort=-createdDate") or {}
              print(len(subs.get("data", [])), "crash submissions")
              for s in subs.get("data", []):
                  a = s["attributes"]
                  print(a.get("createdDate"), a.get("deviceModel"), a.get("osVersion"), a.get("appBuildVersion") if "appBuildVersion" in a else "", (a.get("comment") or "")[:200])
                  log = get(f"/v1/betaFeedbackCrashSubmissions/{s['id']}/crashLog") or {}
                  text = (log.get("data") or {}).get("attributes", {}).get("logText") or ""
                  open(os.path.join(os.environ["OUT"], s["id"] + ".crash"), "w").write(text)
                  print("\n".join(text.splitlines()[:60]))
          PY
          rm -rf "$RUNNER_TEMP/keys"
      - name: Use the newest Xcode or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
      - name: Build for the simulator
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project Solar.xcodeproj -scheme Solar -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO | tail -5
      - name: Switch tabs quickly in the simulator
        run: |
          # an iPhone on the newest iOS runtime (26 or later), where the tab bar is Liquid Glass
          DEV=$(xcrun simctl list devices available | awk '/^-- iOS 2[6-9]/{f=1;next} /^--/{f=0} f' | grep -E "iPhone 1[6-9] Pro \(" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"; xcrun simctl list devices | grep "$DEV"
          xcrun simctl list runtimes | tail -3
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name "Solar.app")
          xcrun simctl install "$DEV" "$APP"
          mkdir -p "$RUNNER_TEMP/crashes/sim"
          SIMLOGS=~/Library/Developer/CoreSimulator/Devices/$DEV/data/Library/Logs/CrashReporter
          for run in 1 2 3; do
            mode=light; [ $run = 2 ] && mode=dark
            xcrun simctl ui "$DEV" appearance $mode
            START=$(date +%s)
            xcrun simctl launch "$DEV" ca.davidalleyne.solar -previewNow -cycle
            sleep 70
            xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/crashes/sim/end-$run-$mode.png" || true
            if xcrun simctl spawn "$DEV" launchctl list | grep -q ca.davidalleyne.solar; then echo "run $run $mode: still running"; else echo "run $run $mode: NOT RUNNING (crashed)"; fi
            xcrun simctl spawn "$DEV" log show --last 2m --style compact --predicate 'process == "Solar" AND (messageType == fault OR messageType == error)' > "$RUNNER_TEMP/crashes/sim/log-$run.txt" 2>&1 || true
            tail -40 "$RUNNER_TEMP/crashes/sim/log-$run.txt"
            xcrun simctl terminate "$DEV" ca.davidalleyne.solar || true
          done
          sleep 10
          for d in ~/Library/Logs/DiagnosticReports "$SIMLOGS"; do
            find "$d" -type f \( -name "Solar*" -o -name "*.ips" \) -mmin -30 -exec cp {} "$RUNNER_TEMP/crashes/sim/" \; 2>/dev/null || true
          done
          ls -la "$RUNNER_TEMP/crashes/sim"
          for f in "$RUNNER_TEMP"/crashes/sim/*.ips; do [ -f "$f" ] || continue; echo "== $f"; python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read().split("\n", 1)
          head = json.loads(raw[0]); print(head.get("app_name"), head.get("os_version"))
          try:
              b = json.loads(raw[1])
          except Exception:
              print(raw[1][:4000]); sys.exit()
          print(json.dumps(b.get("exception"), indent=1), b.get("termination"), b.get("asi"))
          imgs = b.get("usedImages", [])
          for t in b.get("threads", []):
              if not t.get("triggered"): continue
              for fr in t.get("frames", [])[:40]:
                  im = imgs[fr["imageIndex"]].get("name", "?") if fr.get("imageIndex", -1) < len(imgs) else "?"
                  print(" ", im, fr.get("symbol", ""), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          for k in ("lastExceptionBacktrace",):
              for fr in (b.get(k) or [])[:30]:
                  im = imgs[fr["imageIndex"]].get("name", "?")
                  print(" LEB", im, fr.get("symbol", ""))
          PY
          done
      - name: Tap and slide the real tab bar (UI tests)
        if: always()
        working-directory: ios
        run: |
          DEV=$(xcrun simctl list devices available | awk '/^-- iOS 2[6-9]/{f=1;next} /^--/{f=0} f' | grep -E "iPhone 1[6-9] Pro \(" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          set +e
          xcodebuild test -project Solar.xcodeproj -scheme Solar -configuration Debug -destination "id=$DEV" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/crashes/tests.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "Test Case|error|crash|Crash|stopped after|signal|Executed|\*\* TEST" | head -120
          set -e
          sleep 5
          for d in ~/Library/Logs/DiagnosticReports ~/Library/Developer/CoreSimulator/Devices/$DEV/data/Library/Logs/CrashReporter; do
            find "$d" -type f -name "Solar*" -mmin -60 -exec cp {} "$RUNNER_TEMP/crashes/" \; 2>/dev/null
          done
          for f in "$RUNNER_TEMP"/crashes/Solar*.ips; do [ -f "$f" ] || continue; echo "== $f"; python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read().split("\n", 1)
          b = json.loads(raw[1])
          print(json.dumps(b.get("exception")), b.get("termination", {}).get("indicator"), json.dumps(b.get("asi"))[:1500])
          imgs = b.get("usedImages", [])
          for t in b.get("threads", []):
              if not t.get("triggered"): continue
              for fr in t.get("frames", [])[:45]:
                  im = imgs[fr["imageIndex"]].get("name", "?")
                  print(" ", im, fr.get("symbol", ""), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          for fr in (b.get("lastExceptionBacktrace") or [])[:30]:
              print(" LEB", imgs[fr["imageIndex"]].get("name", "?"), fr.get("symbol", ""))
          PY
          done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashes
          path: ${{ runner.temp }}/crashes
          retention-days: 1
