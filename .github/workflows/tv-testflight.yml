name: Apple TV app to TestFlight

# Builds Solar for Apple TV (ios/TV, ios/TopShelf, sharing ios/Solar/Model) and uploads it to
# TestFlight under the same app as the iPhone version. Runs when the TV code or the shared
# model changes, or by hand.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/TV/**", "ios/TopShelf/**", "ios/Solar/Model/**", "ios/SolarWidgets/WidgetData.swift", "ios/project.yml", ".github/workflows/tv-testflight.yml"]

concurrency:
  group: tv-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: M8GX2N7YR2
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest released Xcode and SDK
        run: |
          # Newest non-beta Xcode on the runner, so every build uses the latest released Apple SDKs
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No released Xcode on this runner"; ls /Applications | grep Xcode; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|appletvos" || true

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the Apple TV simulator (shows compile errors clearly)
        run: |
          xcodebuild build -project Solar.xcodeproj -scheme SolarTV -configuration Debug -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -80; tail -30 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "built"

      - name: Photograph the screens in the simulator
        continue-on-error: true
        run: |
          DEV=$(xcrun simctl list devices available | awk '/^-- tvOS/{f=1;next} /^--/{f=0} f' | grep -E "Apple TV 4K" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$(find "$RUNNER_TEMP/dd/Build/Products/Debug-appletvsimulator" -maxdepth 1 -name Solar.app)"
          mkdir -p "$RUNNER_TEMP/tvshots"
          for tab in now month history ask settings ambient; do
            xcrun simctl terminate "$DEV" ca.davidalleyne.solar || true
            xcrun simctl launch "$DEV" ca.davidalleyne.solar -previewTV -$tab
            sleep 8
            xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/tvshots/$tab.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvshots
          path: ${{ runner.temp }}/tvshots
          retention-days: 3

      - name: Write the App Store Connect key, register the Top Shelf's bundle ID
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, jwt
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
                           open(os.environ["KEY_PATH"]).read(), algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          body = json.dumps({"data": {"type": "bundleIds", "attributes": {"identifier": "ca.davidalleyne.solar.topshelf", "name": "Solar Top Shelf", "platform": "IOS"}}}).encode()
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/bundleIds", body, {"Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req); print("registered ca.davidalleyne.solar.topshelf")
          except urllib.error.HTTPError as e:
              print("already registered" if e.code == 409 else f"{e.code} {e.read()[:300]}")
          PY

      - name: Archive
        run: |
          xcodebuild archive -project Solar.xcodeproj -scheme SolarTV -configuration Release \
            -destination 'generic/platform=tvOS' -archivePath "$RUNNER_TEMP/SolarTV.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES CURRENT_PROJECT_VERSION="${{ github.run_number }}" > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -60; tail -30 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Sign and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SolarTV.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -40
          test ${PIPESTATUS[0]} -eq 0

      - name: Wait for processing, then give the build to every TestFlight group
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, jwt
          def tok():
              return jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
                                open(os.environ["KEY_PATH"]).read(), algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def call(path, body=None, method=None):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, json.dumps(body).encode() if body else None,
                                         {"Authorization": f"Bearer {tok()}", "Content-Type": "application/json"}, method=method)
              try:
                  d = urllib.request.urlopen(r).read(); return json.loads(d) if d else {}
              except urllib.error.HTTPError as e:
                  print(path, e.code, e.read()[:400].decode(errors="ignore")); return None
          app = call("/v1/apps?filter[bundleId]=ca.davidalleyne.solar")["data"][0]["id"]
          want = os.environ["BUILD"]
          b = None
          for i in range(40):
              r = call(f"/v1/builds?filter[app]={app}&filter[version]={want}&filter[preReleaseVersion.platform]=TV_OS&limit=1") or {}
              if r.get("data"):
                  b = r["data"][0]; st = b["attributes"]["processingState"]; print("build", want, st)
                  if st != "PROCESSING": break
              else:
                  print("waiting for the build to appear")
              time.sleep(30)
          if not b: raise SystemExit("build not found")
          if b["attributes"].get("usesNonExemptEncryption") is None:
              call(f"/v1/builds/{b['id']}", {"data": {"type": "builds", "id": b["id"], "attributes": {"usesNonExemptEncryption": False}}}, "PATCH")
          groups = call(f"/v1/apps/{app}/betaGroups?limit=50") or {}
          for g in groups.get("data", []):
              a = g["attributes"]
              res = call(f"/v1/betaGroups/{g['id']}/relationships/builds", {"data": [{"type": "builds", "id": b["id"]}]}, "POST")
              print("group", a.get("name"), "internal" if a.get("isInternalGroup") else "external", "ok" if res is not None else "not added")
          # what TestFlight sees: each group, its testers, and every tester given this build directly
          for g in groups.get("data", []):
              a = g["attributes"]
              print("group", a.get("name"), {k: a.get(k) for k in ("isInternalGroup", "hasAccessToAllBuilds", "publicLinkEnabled")})
              ts = call(f"/v1/betaGroups/{g['id']}/betaTesters?limit=50") or {}
              ids = []
              for t in ts.get("data", []):
                  ta = t["attributes"]; ids.append(t["id"])
                  print("  tester", ta.get("firstName"), (ta.get("email") or "")[:3] + "…", ta.get("inviteType"), ta.get("state"))
              if ids:
                  r = call(f"/v1/builds/{b['id']}/relationships/individualTesters", {"data": [{"type": "betaTesters", "id": i} for i in ids]}, "POST")
                  print("  testers given this build directly:", "yes" if r is not None else "no")
          pv = call(f"/v1/builds/{b['id']}/preReleaseVersion") or {}
          print("version", json.dumps((pv.get("data") or {}).get("attributes", {})))
          print("expired", b["attributes"].get("expired"), "min OS", b["attributes"].get("minOsVersion"))
          d = call(f"/v1/builds/{b['id']}/buildBetaDetail") or {}
          print("TestFlight state:", json.dumps((d.get("data") or {}).get("attributes", {})))
          PY
        env:
          BUILD: ${{ github.run_number }}

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
